[package]
name = "tagent-cli"
version = "0.16.0+002"
edition = "2021"
description = "Cross-platform text translator: global hotkey, interactive terminal, and CLI modes using Google Translate"
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://github.com/holgertkey/tagent"
readme = "README.md"
keywords = ["translation", "translate", "cli", "dictionary", "tts"]
categories = ["command-line-utilities", "internationalization"]

[features]
default = ["binary-resources"]
binary-resources = []

[[bin]]
name = "tagent-cli"
path = "src/main.rs"

[dependencies]
tagent = { path = "../tagent" }
# Cross-platform dependencies
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
colored = "2.1"
rodio = { version = "0.21", features = ["symphonia-mp3"] }
arboard = "3.4"
ctrlc = "3.4"
rustyline = "18.0.1"

[dev-dependencies]
async-trait = "0.1"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console"
] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib"] }

# Windows-only build dependencies
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
