[package]
name = "tagent-cli"
version = "0.17.0+031"
edition = "2021"
description = "Cross-platform text translator: global hotkey, interactive terminal, and CLI modes using Google Translate"
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://holgertkey.github.io/tagent/"
documentation = "https://holgertkey.github.io/tagent/"
readme = "README.md"
keywords = ["translation", "translate", "cli", "dictionary", "tts"]
categories = ["command-line-utilities", "internationalization"]

[features]
default = ["binary-resources"]
binary-resources = []

[[bin]]
name = "tagent-cli"
path = "src/main.rs"

[dependencies]
# `version` is what crates.io resolves after publishing; keep it at (or below) the
# `tagent` version this app actually needs. `path` is used for local development.
tagent = { path = "../tagent", version = "0.19.0", features = ["deepl", "openai"] }
# Cross-platform dependencies
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
colored = "2.1"
rodio = { version = "0.21", features = ["symphonia-mp3"] }
arboard = "3.4"
ctrlc = "3.4"
rustyline = "18.0.1"
# The system locale, for the default target language
sys-locale = "0.3"
# `tagent-cli.toml`: serde for reading, the format-preserving document for `/save`.
serde = { version = "1.0", features = ["derive"] }
toml_edit = { version = "0.25", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console"
] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib", "xtest"] }
# Global hotkeys on Wayland through the GlobalShortcuts portal (`platform/linux/portal.rs`).
# `async-io`, not `tokio`, though it runs on this app's Tokio runtime: Cargo unifies features
# across the workspace, `tagent-gui` needs `async-io` (Slint's tray shares `zbus`), and ashpd
# refuses both at once. With `async-io`, zbus runs its own executor; Tokio just drives the
# futures.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"

# Windows-only build dependencies
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
