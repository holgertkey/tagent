[workspace]
members = ["tagent", "tagent-cli", "tagent-gui"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
# Optimized for size: ~16% smaller binaries and a faster build than opt-level 3, with no
# noticeable slowdown (network-bound, GPU-rendered GUI). Measured 2026-10-09.
opt-level = "s"
panic = "abort"
strip = "debuginfo"
