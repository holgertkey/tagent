[package]
name = "tagent"
version = "0.11.0+016"
edition = "2021"
description = "Text translator with unified GUI/Interactive interface and CLI mode"
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent-win"
readme = "README.md"
keywords = ["translation", "gui", "cli", "dictionary"]
categories = ["command-line-utilities", "internationalization"]

[dependencies]
# Cross-platform dependencies
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.4"
dirs = "5.0"
colored = "2.1"
rodio = { version = "0.21", features = ["symphonia-mp3"] }
urlencoding = "2.1"
arboard = "3.4"
ctrlc = "3.4"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console"
] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Windows-only build dependencies
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
