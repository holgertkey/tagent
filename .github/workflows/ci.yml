name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        uses: ./.github/actions/install-linux-deps

      # The whole workspace: tagent, tagent-cli and tagent-gui.
      - name: Check
        run: cargo check --workspace --all-targets --locked

      # Clippy, rustdoc and the packaging dry run below only run on Linux, where they
      # are known clean; Windows still gets check/test/build.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

      - name: Docs (tagent library)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tagent --no-deps --locked

      # Catches a missing/stale `version` on the `tagent` path dependency, missing
      # packaged files, and build scripts that don't work from the packaged sources.
      - name: crates.io packaging dry run
        if: runner.os == 'Linux'
        run: .github/scripts/publish-crates.sh --dry-run
