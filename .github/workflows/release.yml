name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tagent.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tagent
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libasound2-dev libxdo-dev libxtst-dev

      - name: Build release
        run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path target/release/tagent.exe -DestinationPath "tagent-${version}-windows-x86_64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${{ github.ref_name }}"
          tar -czf "tagent-${version}-linux-x86_64.tar.gz" -C target/release tagent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tagent-${{ runner.os }}
          path: tagent-${{ github.ref_name }}-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for current version
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Extract section between current version header and next version header
          changelog=$(awk "/^## \\[${version//./\\.}/ {found=1; next} /^## \\[/ {if(found) exit} /^---$/ {if(found) exit} found {print}" CHANGELOG.md)
          # Write to file for gh-release body
          echo "$changelog" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: artifacts/*
