name: Release

# Pushing a `v*` tag releases all three crates together:
#   - builds the tagent-cli and tagent-gui binaries for Windows and Linux,
#   - publishes tagent, tagent-cli and tagent-gui to crates.io (each one only if its
#     version isn't already there), and
#   - creates the GitHub Release with the binaries and notes from the crates' CHANGELOGs.
#
# The crates are versioned independently, so the versions come from each crate's
# Cargo.toml, not from the tag name. Release versions carry no `+BUILD` suffix.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token allowed to
# publish new crates and new versions).

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        uses: ./.github/actions/install-linux-deps

      - name: Versions carry no +BUILD suffix
        run: |
          bad=$(grep -H '^version *=' tagent/Cargo.toml tagent-cli/Cargo.toml tagent-gui/Cargo.toml | grep '+' || true)
          if [ -n "$bad" ]; then
            echo "::error::Strip the +BUILD suffix from every crate before releasing:"
            echo "$bad"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      # tagent-cli's build.rs (run by the test build above) syncs the version into its
      # README.md/CHANGELOG.md and CLAUDE.md; if that changed anything, the committed
      # docs were behind Cargo.toml.
      - name: Docs are in sync with the versions
        run: |
          if ! git diff --exit-code; then
            echo "::error::Docs were out of sync with Cargo.toml. Run 'cargo build -p tagent-cli' and commit the result."
            exit 1
          fi

      - name: Release notes can be built
        run: .github/scripts/release-notes.sh > /dev/null

      - name: crates.io packaging dry run
        run: .github/scripts/publish-crates.sh --dry-run

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        uses: ./.github/actions/install-linux-deps

      - name: Build release
        run: cargo build --release --locked -p tagent-cli -p tagent-gui

      - name: Read crate versions
        shell: bash
        run: |
          version_of() { sed -n 's/^version *= *"\(.*\)"/\1/p' "$1/Cargo.toml" | head -n1; }
          echo "CLI_VERSION=$(version_of tagent-cli)" >> "$GITHUB_ENV"
          echo "GUI_VERSION=$(version_of tagent-gui)" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/tagent-cli.exe -DestinationPath "tagent-cli-$env:CLI_VERSION-windows-x86_64.zip"
          Compress-Archive -Path target/release/tagent-gui.exe -DestinationPath "tagent-gui-$env:GUI_VERSION-windows-x86_64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "tagent-cli-${CLI_VERSION}-linux-x86_64.tar.gz" -C target/release tagent-cli
          tar -czf "tagent-gui-${GUI_VERSION}-linux-x86_64.tar.gz" -C target/release tagent-gui

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            tagent-cli-*
            tagent-gui-*

  publish:
    name: Publish to crates.io
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        uses: ./.github/actions/install-linux-deps

      # Safe to re-run after a partial failure: crates already on crates.io are skipped.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN repository secret is not set."
            exit 1
          fi
          .github/scripts/publish-crates.sh

  release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes from the crates' changelogs
        run: .github/scripts/release-notes.sh > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: artifacts/*
