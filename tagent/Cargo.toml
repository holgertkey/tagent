[package]
name = "tagent"
version = "0.19.0+007"
edition = "2021"
description = "Translation, dictionary, and text-to-speech library powering Tagent."
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://github.com/holgertkey/tagent"
readme = "README.md"
keywords = ["translation", "translate", "dictionary", "tts"]
categories = ["internationalization"]

[lib]
name = "tagent"
path = "src/lib.rs"

[features]
default = ["google", "deepl", "openai"]
# One feature per built-in provider kind; the shared transport, options and profiles are
# always compiled. A provider without dependencies of its own is in `default`; one that
# brings heavy dependencies is opt-in.
# Google Translate, dictionary and TTS over Google's unofficial endpoints.
google = []
# DeepL translation over its official, keyed API.
deepl = []
# Translation through any OpenAI-compatible chat-completions server (OpenAI, Ollama, ...).
openai = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
urlencoding = "2.1"
thiserror = "1.0"
# Only the timer, for the transport's backoff between retries.
tokio = { version = "1.0", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[[example]]
name = "translate"
required-features = ["google"]

[[example]]
name = "dictionary"
required-features = ["google"]

[[example]]
name = "speak"
required-features = ["google"]
