[package]
name = "tagent"
version = "1.0.0"
edition = "2021"
description = "Translation, dictionary, and text-to-speech library powering Tagent."
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://github.com/holgertkey/tagent"
readme = "../README.md"
keywords = ["translation", "translate", "dictionary", "tts"]
categories = ["internationalization"]

[lib]
name = "tagent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.4"
urlencoding = "2.1"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
