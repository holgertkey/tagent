[package]
name = "tagent-gui"
version = "0.14.0+008"
edition = "2021"
description = "Tagent GUI — cross-platform desktop text translator built with Slint: global hotkey, tray icon, dictionary and text-to-speech"
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://github.com/holgertkey/tagent"
readme = "README.md"
keywords = ["translation", "translate", "gui", "slint", "dictionary"]
categories = ["gui", "internationalization"]
build = "build.rs"

[[bin]]
name = "tagent-gui"
path = "src/main.rs"

[dependencies]
# `version` is what crates.io resolves after publishing; keep it at (or below) the
# `tagent` version this app actually needs. `path` is used for local development.
tagent = { path = "../tagent", version = "0.18.1" }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1"
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.21", features = ["symphonia-mp3"] }

[dev-dependencies]
tempfile = "3"
# Headless Slint backend for the transcript auto-scroll test; keep in step with `slint`.
i-slint-backend-testing = "1.17"

[build-dependencies]
slint-build = "1"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.4"
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib"] }

# Windows-only build dependencies
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
