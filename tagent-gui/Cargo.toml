[package]
name = "tagent-gui"
version = "0.15.0+031"
edition = "2021"
description = "Tagent GUI — cross-platform desktop text translator built with Slint: global hotkey, tray icon, dictionary and text-to-speech"
authors = ["Holgert K"]
license = "MIT"
repository = "https://github.com/holgertkey/tagent"
homepage = "https://holgertkey.github.io/tagent/"
documentation = "https://holgertkey.github.io/tagent/"
readme = "README.md"
keywords = ["translation", "translate", "gui", "slint", "dictionary"]
categories = ["gui", "internationalization"]
build = "build.rs"

# `.deb` package, built by `cargo deb -p tagent-gui` (the release workflow runs it with
# `--no-build` after `cargo build --release`). Installs the launcher entry and icon
# system-wide, the packaged counterpart of `tagent-gui --install-desktop`.
[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
A desktop text translator: a global hotkey translates the current selection into a \
popup next to the cursor, with a system-tray icon, dictionary lookups for single words \
and text-to-speech. Uses Google Translate by default. The global hotkeys work on X11 and \
on Wayland desktops with the Global Shortcuts portal, such as GNOME."""
assets = [
    ["target/release/tagent-gui", "usr/bin/", "755"],
    ["assets/linux/io.github.holgertkey.TagentGui.desktop", "usr/share/applications/", "644"],
    ["assets/icons/tray.png", "usr/share/icons/hicolor/512x512/apps/io.github.holgertkey.TagentGui.png", "644"],
    ["README.md", "usr/share/doc/tagent-gui/", "644"],
    ["CHANGELOG.md", "usr/share/doc/tagent-gui/", "644"],
]

[[bin]]
name = "tagent-gui"
path = "src/main.rs"

[dependencies]
# `version` is what crates.io resolves after publishing; keep it at (or below) the
# `tagent` version this app actually needs. `path` is used for local development.
tagent = { path = "../tagent", version = "0.19.0", features = ["deepl", "openai"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `unstable-winit-030`: the winit event filter behind `latin_shortcuts` (Ctrl+V and
# friends in non-Latin keyboard layouts).
slint = { version = "1", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.21", features = ["symphonia-mp3"] }
# The system's preferred languages, for the default `target_language`.
sys-locale = "0.3"
# Single instance: a second start asks the running copy over a local socket to show its
# window (`single_instance.rs`).
interprocess = "2"

[dev-dependencies]
tempfile = "3"
# Reads Segoe UI's character map in a Windows-only glyph test (already in the tree via Slint).
ttf-parser = "0.25"
# Headless Slint backend for the transcript auto-scroll test; keep in step with `slint`.
i-slint-backend-testing = "1.17"

[build-dependencies]
slint-build = "1"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

# Unix-only dependencies (`setsid` for detaching from the terminal)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.4"
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib", "xtest"] }
# Global hotkeys on Wayland through the GlobalShortcuts portal (`platform/linux/portal.rs`).
# `async-io`, not `tokio`: zbus is shared with Slint's tray, and its `tokio` feature would make
# every zbus call in the process require a Tokio runtime (the tray panicked on the main thread).
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"

# Windows-only build dependencies
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
