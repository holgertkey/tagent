[package]
name = "tagent-gui"
version = "0.14.0+041"
edition = "2021"
description = "Tagent GUI — cross-platform text translator with Slint"
publish = false
readme = "README.md"
build = "build.rs"

[[bin]]
name = "tagent-gui"
path = "src/main.rs"

[dependencies]
tagent = { path = "../tagent" }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.4"
rdev = "0.5"
x11 = { version = "2.21", features = ["xlib"] }
