[package]
name = "tagent-gui"
version = "0.12.0"
edition = "2021"
description = "Tagent GUI — cross-platform text translator with Tauri"
publish = false

[lib]
name = "tagent_gui_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tagent-gui"
path = "src/main.rs"

[dependencies]
tagent = { path = "../../", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
